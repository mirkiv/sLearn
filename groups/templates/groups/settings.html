{% extends 'base.html' %}
{% load static custom_dict %}
{% block title %}{% t 'group_settings_title' %} - {{ group.name }}{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/groups.css' %}">
{% endblock %}

{% block content %}
<div class="card" style="max-width: 640px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem; margin-top: 0;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> {% t 'group_settings_title' %}</h2>
    <form method="post">
        {% csrf_token %}
        <label for="name">{% t 'group_name' %}</label>
        <input type="text" name="name" id="name" class="form-control" value="{{ group.name }}" required>

        <label for="description" style="margin-top:1rem;">{% t 'group_desc_optional' %}</label>
        <textarea name="description" id="description" class="form-control" rows="4">{{ group.description }}</textarea>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1.5rem;">
            <div>
                <label style="font-weight:700;margin-bottom:.5rem;display:block;">{% t 'group_type_label' %}</label>
                <div class="card" style="padding:1rem;margin:0;">
                    <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;margin-bottom:.8rem;">
                        <input type="radio" name="group_type" value="open" {% if group.group_type=='open' %}checked{% endif %} style="accent-color:var(--primary-color);width:18px;height:18px;">
                        <div>
                            <strong>{% t 'group_type_open' %}</strong>
                            <div style="font-size:.82rem;color:var(--secondary-color);margin-top:2px;">{% t 'group_type_open_desc' %}</div>
                        </div>
                    </label>
                    <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;">
                        <input type="radio" name="group_type" value="moderated" {% if group.group_type=='moderated' %}checked{% endif %} style="accent-color:var(--primary-color);width:18px;height:18px;">
                        <div>
                            <strong>{% t 'group_type_moderated' %}</strong>
                            <div style="font-size:.82rem;color:var(--secondary-color);margin-top:2px;">{% t 'group_type_moderated_desc' %}</div>
                        </div>
                    </label>
                </div>
            </div>
            <div>
                <label style="font-weight:700;margin-bottom:.5rem;display:block;">{% t 'access_type_label' %}</label>
                <div class="card" style="padding:1rem;margin:0;">
                    <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;margin-bottom:.8rem;">
                        <input type="radio" name="access_type" value="public" {% if group.access_type=='public' %}checked{% endif %} style="accent-color:var(--primary-color);width:18px;height:18px;">
                        <div>
                            <strong>{% t 'access_public' %}</strong>
                            <div style="font-size:.82rem;color:var(--secondary-color);margin-top:2px;">{% t 'access_public_desc' %}</div>
                        </div>
                    </label>
                    <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;">
                        <input type="radio" name="access_type" value="private" {% if group.access_type=='private' %}checked{% endif %} style="accent-color:var(--primary-color);width:18px;height:18px;">
                        <div>
                            <strong>{% t 'access_private' %}</strong>
                            <div style="font-size:.82rem;color:var(--secondary-color);margin-top:2px;">{% t 'access_private_desc' %}</div>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <div style="margin-top: 1.5rem; display:flex; gap:1rem;">
            <button type="submit" class="btn" style="flex:1;">{% t 'save_changes' %}</button>
            <a href="{% url 'groups:detail' group.pk %}" class="btn btn-outline" style="flex:1;text-align:center;">{% t 'cancel' %}</a>
        </div>
    </form>
</div>
{% endblock %}
