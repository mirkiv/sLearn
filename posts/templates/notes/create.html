{% extends 'base.html' %}
{% block title %}Create Note - SLearn{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-bottom: 1.5rem; margin-top: 0;">Create a Note</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 1rem;">
            <button type="submit" class="btn">Save Note</button>
            <a href="{% url 'notes:list' %}" class="btn btn-outline" style="margin-left: 1rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
