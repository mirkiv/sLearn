{% extends 'base.html' %}
{% load custom_dict %}

{% block title %}404 - {% t 'page_not_found' %}{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; padding: 2rem;">
    <div style="font-size: clamp(6rem, 20vw, 12rem); font-weight: 900; color: var(--primary-color); opacity: 0.15; line-height: 0.8; user-select: none;">404</div>
    <div style="background: var(--card-bg); padding: 2.5rem; border-radius: 24px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: -3rem; position: relative; z-index: 1; max-width: 500px; width: 100%;">
        <h1 style="margin: 0 0 1rem; font-size: 2rem; color: var(--text-color);">{% t 'oops_title' %}</h1>
        <p style="color: var(--secondary-color); font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem;">
            {% t 'page_not_found_desc' %}
        </p>
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <a href="{% url 'home' %}" class="btn" style="padding: 14px 30px; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                {% t 'go_home_btn' %}
            </a>
            <button onclick="window.history.back()" class="btn btn-outline" style="padding: 12px 30px; font-size: 0.95rem;">
                {% t 'back' %}
            </button>
        </div>
    </div>
</div>
{% endblock %}
